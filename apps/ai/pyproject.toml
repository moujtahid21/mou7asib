[project]
name = "extraction-harness"
version = "0.0.0"
description = "D1 spike: extraction accuracy and cost measurement harness (docs/build-order.md S1a)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.27,<0.28",
    "pymupdf>=1.24,<2",
    "pillow>=12.0,<13",
]

[project.scripts]
mou7asib-extract-harness = "extraction_harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "mypy>=1.11,<2",
    "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction_harness"]

[tool.mypy]
strict = true
python_version = "3.14"

[[tool.mypy.overrides]]
module = "fitz"
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 100
