# Local development database only. Not a deployment artifact.
#
# Started with `npm run db:up`. The credentials here are local-only and
# deliberately committed; real credentials never live in the repo
# (CLAUDE.md §8.5).
services:
  postgres:
    image: postgres:18-alpine
    container_name: mou7asib-pg
    # Without this the container does not survive a Docker Desktop restart,
    # and the app fails with a connection error that looks like a code bug.
    restart: unless-stopped
    environment:
      POSTGRES_USER: mou7asib
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: mou7asib
    ports:
      # 5433 on the host to avoid colliding with a locally installed Postgres.
      - "5433:5432"
    volumes:
      # Named volume, so `docker rm` does not destroy the database.
      # Postgres 18+ wants a single mount at /var/lib/postgresql, NOT at
      # /var/lib/postgresql/data — the older path leaves the data directory
      # unused and the server refuses to start.
      - mou7asib-pgdata:/var/lib/postgresql
      # Only runs on a brand-new (empty) volume — see db-init/01-app-role.sql for why
      # this exists (RLS needs a non-superuser runtime role) and how to apply it to an
      # already-initialized volume by hand.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mou7asib -d mou7asib"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mou7asib-pgdata:
